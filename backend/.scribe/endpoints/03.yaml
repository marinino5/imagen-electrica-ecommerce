        name: address
        description: 'Dirección de entrega. Obligatoria si no es pickup y el cliente no tiene dirección guardada.'
        required: false
        example: 'Zona Industrial Chimitá, bodega 12'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
