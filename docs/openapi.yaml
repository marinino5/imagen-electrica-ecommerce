openapi: 3.0.3
info:
  title: 'API de Imagen Eléctrica'
  description: 'API REST del e-commerce B2B de Imagen Eléctrica: catálogo público, cuenta del cliente, pedidos y cotizaciones, y gestión de productos para administradores.'
  version: 1.0.0
servers:
  -
    url: 'https://imagen-electrica-ecommerce.onrender.com'
tags:
  -
    name: Autenticación
    description: ''
  -
    name: 'Catálogo (público)'
    description: ''
  -
    name: 'Mi cuenta'
    description: ''
  -
    name: 'Pedidos y cotizaciones (cliente)'
    description: ''
  -
    name: 'Productos (administrador)'
    description: "\nRequiere el token de un usuario con rol admin; con otro rol responde 403."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Obtén el token con <code>POST /api/v1/login</code> y envíalo como <code>Bearer {token}</code>. Las rutas marcadas con «requires authentication» lo necesitan.'
security:
  -
    default: []
paths:
  /api/v1/register:
    post:
      summary: 'Registrar cliente'
      operationId: registrarCliente
      description: "Crea la cuenta (rol cliente) con los datos de su empresa y devuelve un token listo\npara usar. Aceptar la política de datos es obligatorio; el marketing es opcional.\nMáximo 5 intentos por minuto."
      parameters: []
      responses:
        201:
          description: 'Cuenta creada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    name: 'Laura Gómez'
                    email: laura@constructoraaltos.test
                    role: cliente
                    customer:
                      company_name: 'Constructora Altos S.A.S.'
                      nit: 900765432-8
                      contact_name: 'Laura Gómez'
                      phone: '315 555 0202'
                      city: Bucaramanga
                      address: null
                      marketing_opt_in: false
                      marketing_opt_in_at: null
                      privacy_accepted_at: '2026-10-25T15:00:00.000000Z'
                  token: 1|abc123...
                  token_type: Bearer
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Laura Gómez'
                      email:
                        type: string
                        example: laura@constructoraaltos.test
                      role:
                        type: string
                        example: cliente
                      customer:
                        type: object
                        properties:
                          company_name:
                            type: string
                            example: 'Constructora Altos S.A.S.'
                          nit:
                            type: string
                            example: 900765432-8
                          contact_name:
                            type: string
                            example: 'Laura Gómez'
                          phone:
                            type: string
                            example: '315 555 0202'
                          city:
                            type: string
                            example: Bucaramanga
                          address:
                            type: string
                            example: null
                            nullable: true
                          marketing_opt_in:
                            type: boolean
                            example: false
                          marketing_opt_in_at:
                            type: string
                            example: null
                            nullable: true
                          privacy_accepted_at:
                            type: string
                            example: '2026-10-25T15:00:00.000000Z'
                  token:
                    type: string
                    example: 1|abc123...
                  token_type:
                    type: string
                    example: Bearer
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nombre de la persona de contacto.'
                  example: 'Laura Gómez'
                email:
                  type: string
                  description: 'Correo (único).'
                  example: laura@constructoraaltos.test
                password:
                  type: string
                  description: 'Mínimo 8 caracteres.'
                  example: ClaveSegura2026
                company_name:
                  type: string
                  description: 'Razón social.'
                  example: 'Constructora Altos S.A.S.'
                nit:
                  type: string
                  description: 'NIT (único).'
                  example: 900765432-8
                phone:
                  type: string
                  description: Teléfono.
                  example: '315 555 0202'
                city:
                  type: string
                  description: Ciudad.
                  example: Bucaramanga
                address:
                  type: string
                  description: 'Dirección de entrega habitual.'
                  example: 'Carrera 27 # 45-10'
                  nullable: true
                privacy_accepted:
                  type: boolean
                  description: 'Debe ser true (política de tratamiento de datos).'
                  example: true
                marketing_opt_in:
                  type: boolean
                  description: 'Acepta recibir promociones.'
                  example: false
                  nullable: true
              required:
                - name
                - email
                - password
                - company_name
                - nit
                - phone
                - city
                - privacy_accepted
      security: []
  /api/v1/login:
    post:
      summary: 'Iniciar sesión'
      operationId: iniciarSesin
      description: "Devuelve un token Bearer. Sirve para clientes y para el administrador. Máximo 5 intentos\npor minuto por correo y dirección IP. Credenciales incorrectas responden 401; un usuario\ninactivo, 403."
      parameters: []
      responses:
        200:
          description: 'Sesión iniciada'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 5
                    name: 'Laura Gómez'
                    email: laura@constructoraaltos.test
                    role: cliente
                    customer:
                      company_name: 'Constructora Altos S.A.S.'
                      nit: 900765432-8
                      contact_name: 'Laura Gómez'
                      phone: '315 555 0202'
                      city: Bucaramanga
                      address: null
                      marketing_opt_in: false
                      marketing_opt_in_at: null
                      privacy_accepted_at: '2026-10-25T15:00:00.000000Z'
                  token: 2|xyz789...
                  token_type: Bearer
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 5
                      name:
                        type: string
                        example: 'Laura Gómez'
                      email:
                        type: string
                        example: laura@constructoraaltos.test
                      role:
                        type: string
                        example: cliente
                      customer:
                        type: object
                        properties:
                          company_name:
                            type: string
                            example: 'Constructora Altos S.A.S.'
                          nit:
                            type: string
                            example: 900765432-8
                          contact_name:
                            type: string
                            example: 'Laura Gómez'
                          phone:
                            type: string
                            example: '315 555 0202'
                          city:
                            type: string
                            example: Bucaramanga
                          address:
                            type: string
                            example: null
                            nullable: true
                          marketing_opt_in:
                            type: boolean
                            example: false
                          marketing_opt_in_at:
                            type: string
                            example: null
                            nullable: true
                          privacy_accepted_at:
                            type: string
                            example: '2026-10-25T15:00:00.000000Z'
                  token:
                    type: string
                    example: 2|xyz789...
                  token_type:
                    type: string
                    example: Bearer
        401:
          description: 'Credenciales incorrectas'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'El correo o la contraseña no son correctos.'
                properties:
                  message:
                    type: string
                    example: 'El correo o la contraseña no son correctos.'
      tags:
        - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Correo.
                  example: laura@constructoraaltos.test
                password:
                  type: string
                  description: Contraseña.
                  example: ClaveSegura2026
              required:
                - email
                - password
      security: []
  /api/v1/logout:
    post:
      summary: 'Cerrar sesión'
      operationId: cerrarSesin
      description: 'Revoca el token con el que se hizo la petición. Los tokens de otros dispositivos siguen activos.'
      parameters: []
      responses:
        204:
          description: 'Sesión cerrada'
          content:
            application/json:
              schema:
                type: object
                example: {}
                properties: {}
      tags:
        - Autenticación
  /api/v1/categories:
    get:
      summary: 'Listar categorías'
      operationId: listarCategoras
      description: "Categorías activas en orden de árbol: cada categoría principal seguida de sus\nsubcategorías (`parent_id` indica el padre). No requiere token."
