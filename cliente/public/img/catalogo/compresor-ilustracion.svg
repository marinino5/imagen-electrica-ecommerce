<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="Ilustración de un compresor de pistón vertical">
  <defs>
    <linearGradient id="tank" x1="0" x2="1">
      <stop offset="0" stop-color="#3f3069"/>
      <stop offset="0.3" stop-color="#6a58a0"/>
      <stop offset="0.55" stop-color="#5a4890"/>
      <stop offset="1" stop-color="#33265a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#8a8798"/>
      <stop offset="0.35" stop-color="#d7d4e0"/>
      <stop offset="0.7" stop-color="#a9a5b8"/>
      <stop offset="1" stop-color="#6f6b80"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" x2="1">
      <stop offset="0" stop-color="#46435a"/>
      <stop offset="0.4" stop-color="#7a768e"/>
      <stop offset="1" stop-color="#3a3750"/>
    </linearGradient>
    <radialGradient id="gauge" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcd8e6"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <!-- sombra de contacto -->
  <ellipse cx="500" cy="884" rx="250" ry="14" fill="#261c3e" opacity="0.42" filter="url(#soft)"/>
  <!-- patas -->
  <rect x="392" y="842" width="38" height="38" rx="6" fill="#2a2147"/>
  <rect x="570" y="842" width="38" height="38" rx="6" fill="#2a2147"/>
  <!-- tanque vertical -->
  <rect x="372" y="330" width="256" height="520" rx="128" fill="url(#tank)"/>
  <path d="M372 458h256" stroke="#2a2147" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M372 722h256" stroke="#2a2147" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="404" y="372" width="18" height="400" rx="9" fill="#ffffff" opacity="0.14"/>
  <!-- manómetro -->
  <circle cx="500" cy="540" r="46" fill="#2a2147"/>
  <circle cx="500" cy="540" r="38" fill="url(#gauge)"/>
  <path d="M500 540l22-20" stroke="#261c3e" stroke-width="4" stroke-linecap="round"/>
  <circle cx="500" cy="540" r="5" fill="#261c3e"/>
  <path d="M470 560a38 38 0 0 1 0-40M530 560a38 38 0 0 0 0-40" stroke="#5a4890" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- válvula de salida -->
  <rect x="610" y="610" width="64" height="26" rx="8" fill="url(#steel)"/>
  <rect x="668" y="602" width="22" height="42" rx="6" fill="#2a2147"/>
  <!-- cabezal de la bomba: dos cilindros con aletas -->
  <rect x="470" y="190" width="170" height="150" rx="16" fill="url(#iron)"/>
  <g fill="url(#steel)">
    <rect x="486" y="132" width="52" height="70" rx="8"/>
    <rect x="572" y="132" width="52" height="70" rx="8"/>
  </g>
  <g stroke="#6f6b80" stroke-width="3">
    <path d="M486 150h52M486 166h52M486 182h52M572 150h52M572 166h52M572 182h52"/>
  </g>
  <rect x="478" y="120" width="68" height="16" rx="6" fill="#2a2147"/>
  <rect x="564" y="120" width="68" height="16" rx="6" fill="#2a2147"/>
  <!-- motor eléctrico -->
  <rect x="300" y="226" width="190" height="104" rx="30" fill="url(#steel)"/>
  <g stroke="#7d7990" stroke-width="3">
    <path d="M330 238v80M350 238v80M370 238v80M390 238v80M410 238v80M430 238v80M450 238v80"/>
  </g>
  <rect x="274" y="250" width="34" height="56" rx="10" fill="#2a2147"/>
  <!-- protector de la correa -->
  <rect x="456" y="214" width="34" height="132" rx="12" fill="#513e84"/>
  <rect x="462" y="224" width="22" height="112" rx="8" fill="#ffffff" opacity="0.12"/>
  <!-- línea de aire -->
  <path d="M580 340v-6" stroke="#2a2147" stroke-width="10" stroke-linecap="round"/>
</svg>
